name: fekra_house
description: Fekra House - bilingual document scanning & organizing app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_bloc: ^8.1.6 # Cubit state management
  get_it: ^7.7.0 # Service locator (dependency wiring)
  dartz: ^0.10.1 # Either<Failure, T>
  equatable: ^2.0.5 # Value equality for states / entities / failures
  camera: ^0.11.0+2 # Live camera preview + capture (scan)
  pdf: ^3.11.1 # Build the scanned PDF
  path_provider: ^2.1.4 # Where to save scanned PDFs
  open_filex: ^4.5.0 # Open a saved PDF in the device viewer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
