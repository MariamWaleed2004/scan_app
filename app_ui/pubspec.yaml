name: fekra_house
description: Fekra House - bilingual document scanning & organizing app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0' # Dart 3 records / switch expressions / Future records `.wait`

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_bloc: ^8.1.6 # Cubit state management
  get_it: ^7.7.0 # Service locator (dependency wiring)
  dartz: ^0.10.1 # Either<Failure, T>
  equatable: ^2.0.5 # Value equality for states / entities / failures

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
